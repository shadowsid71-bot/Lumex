<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lumex – Clipping campaigns</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0B0D0E;--card:#141718;--line:#23282B;--tx:#EDF1F2;--mut:#8C979B;--g:#22E58B;--r:#FF5C5C;--y:#FFC857;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}.w{max-width:1000px;margin:auto;padding:0 18px}
header{position:sticky;top:0;background:#0B0D0Eee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
header .w{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px}.logo i{color:var(--g);font-style:normal}#links{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.b,.btn,button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px}
.btn{display:inline-block;padding:12px 20px;font-weight:700}.g{background:var(--g);color:#04130B;border-color:var(--g)}.red{color:var(--r)}
.hero{padding:56px 0 24px;animation:in .6s}.hero h1{font-size:clamp(38px,8vw,68px);line-height:1.02;margin:0 0 14px}.hero em{color:var(--g);font-style:normal}
.row{display:flex;gap:10px;flex-wrap:wrap}.mut{color:var(--mut)}h2{margin:34px 0 14px}
.stats,.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.stats div,.card,.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;animation:in .5s}
.stats b{display:block;font-size:26px;color:var(--g)}.stats span{color:var(--mut);font-size:13px}
.card h3{margin:10px 0}.top{display:flex;justify-content:space-between;align-items:center}.th{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--g),#0a7a4a);display:grid;place-items:center;font-weight:800;color:#04130B}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--g);color:var(--g);text-transform:uppercase}.badge.paused{border-color:var(--y);color:var(--y)}.badge.closed{border-color:var(--r);color:var(--r)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-bottom:14px}.kv span{color:var(--mut)}.gr{color:var(--g)}
input,select,textarea{width:100%;font:inherit;background:#0E1112;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 12px}label{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}.sc{overflow-x:auto}
.err{color:var(--r)}ul{padding-left:20px}#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--g);color:#04130B;padding:10px 16px;border-radius:12px;display:none;font-weight:600;max-width:90vw;z-index:9}
@keyframes in{from{opacity:0;transform:translateY(10px)}}@media(max-width:640px){.stats,.grid3{grid-template-columns:1fr}}
</style></head><body>
<header><div class="w"><a class="logo" href="#/">Lumex<i>.</i></a><div id="links"></div></div></header>
<main class="w" id="app"></main><div id="toast"></div>
<script>
const U="https://fthdldveifntsxqfadgi.supabase.co",K="sb_publishable_mC_LV7HxprKRqV2DO7Uj8A_dnyHIAV6";
const sb=supabase.createClient(U,K),$=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const earn=(v,c)=>Math.min(v/1000*c.cpm,c.max_payout);
let me=null,prof=null;
const say=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>t.style.display='none',3500)};
const need=()=>{if(!me){location.hash='#/auth';return true}};
function nav(){$('#links').innerHTML='<a href="#/campaigns">Campaigns</a>'+(me?'<a href="#/dash">Dashboard</a><a href="#/submit">Submit clip</a>':'')+(prof&&prof.role==='admin'?'<a href="#/admin">Admin</a>':'')+(me?'<button id="out">Sign out</button>':'<a class="b" href="#/auth">Sign in</a>');const o=$('#out');if(o)o.onclick=()=>sb.auth.signOut()}
const card=c=>`<div class="card"><div class="top"><div class="th">${esc(c.title[0])}</div><span class="badge ${c.status}">${c.status}</span></div><h3>${esc(c.title)}</h3><div class="kv"><span>CPM</span><b class="gr">${money(c.cpm)} / 1k views</b><span>Budget</span><b>${money(c.budget)}</b><span>Max per post</span><b>${money(c.max_payout)}</b><span>Platforms</span><b>${esc((c.platforms||[]).join(', '))}</b></div><a class="btn g" href="#/c/${c.id}">View Campaign</a></div>`;
async function home(){let[{data:s},{data:cs}]=await Promise.all([sb.rpc('stats'),sb.from('campaigns').select('*').eq('status','active').order('created_at').limit(3)]);s=s||{};
app.innerHTML=`<section class="hero"><h1>Clip it. Post it. <em>Get paid.</em></h1><p class="mut">Lumex is a clipping marketplace. Join a campaign, post short clips, and earn per 1,000 verified views.</p><div class="row"><a class="btn g" href="#/campaigns">Browse Campaigns</a><a class="btn" href="#/auth">Join as a Clipper</a></div></section>
<div class="stats"><div><b>${money(s.budget)}</b><span>Total campaign budget</span></div><div><b>${Number(s.views||0).toLocaleString()}</b><span>Verified views</span></div><div><b>${money(s.paid)}</b><span>Paid to creators</span></div></div>
<h2>How it works</h2><div class="grid3"><div class="box"><b>1. Join</b><p class="mut">Pick a campaign and join it.</p></div><div class="box"><b>2. Post</b><p class="mut">Cut clips from the footage and post them publicly.</p></div><div class="box"><b>3. Get paid</b><p class="mut">Submit proof of views. Once approved, you earn per 1,000 verified views.</p></div></div>
<h2>Active campaigns</h2><div class="grid">${(cs||[]).map(card).join('')||'<p class="mut">No active campaigns yet.</p>'}</div>`}
async function campaigns(){const{data}=await sb.from('campaigns').select('*').order('created_at');app.innerHTML='<h2>Campaign marketplace</h2><div class="grid">'+(data||[]).map(card).join('')+'</div>'}
async function camp(id){const{data:c}=await sb.from('campaigns').select('*').eq('id',id).single();let joined=false;
if(me){const{data:m}=await sb.from('campaign_members').select('user_id').eq('user_id',me.id).eq('campaign_id',id);joined=!!(m&&m.length)}
app.innerHTML=`<h2>${esc(c.title)} <span class="badge ${c.status}">${c.status}</span></h2><p class="mut">${esc(c.description)}</p>
<div class="stats"><div><b>${money(c.cpm)}</b><span>per 1,000 views</span></div><div><b>${money(c.budget)}</b><span>Budget</span></div><div><b>${money(c.max_payout)}</b><span>Max per post</span></div></div>
<h2>Requirements</h2><div class="box"><p>Duration: <b>${esc(c.duration)}</b> · Platforms: <b>${esc((c.platforms||[]).join(', '))}</b></p><ul>${(c.requirements||[]).map(r=>'<li>'+esc(r)+'</li>').join('')}</ul></div>
<h2>Payment examples</h2><div class="box">${[1e4,5e4,1e5,2e5].map(v=>`<p>${v.toLocaleString()} views = <b class="gr">${money(earn(v,c))}</b></p>`).join('')}<p class="mut">Paid on verified views only. Max ${money(c.max_payout)} per post.</p></div>
<h2>Links</h2><div class="box"><p>X account to tag: <b>${esc(c.x_account)}</b></p><p>TikTok account: <b>${esc(c.tiktok_account)}</b></p><p>Footage: <a class="gr" href="${esc(c.drive_link)}" target="_blank" rel="noopener">${esc(c.drive_link)}</a></p></div>
<p>${joined?'<a class="btn g" href="#/submit">Submit a clip</a>':c.status==='active'?'<button class="btn g" id="join">Join Campaign</button>':'<span class="mut">This campaign is not open for joining.</span>'}</p>`;
const j=$('#join');if(j)j.onclick=async()=>{if(need())return;const{error}=await sb.from('campaign_members').insert({user_id:me.id,campaign_id:id});if(error)return say(error.message);say('Joined!');camp(id)}}
function auth(){app.innerHTML=`<h2>Sign in to Lumex</h2><div class="box" style="max-width:420px"><label>Email</label><input id="em" type="email" autocomplete="email"><label>Password (6+ characters)</label><input id="pw" type="password" autocomplete="current-password"><div class="row"><button class="btn g" id="si">Sign in</button><button class="btn" id="su">Create account</button></div><p class="mut">or</p><button class="btn" id="go" style="width:100%">Continue with Google</button></div>`;
$('#si').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});error?say(error.message):location.hash='#/dash'};
$('#su').onclick=async()=>{const{data,error}=await sb.auth.signUp({email:$('#em').value,password:$('#pw').value});if(error)return say(error.message);data.session?location.hash='#/dash':say('Check your email to confirm your account.')};
$('#go').onclick=async()=>{const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)say(error.message)}}
async function dash(){if(need())return;const[{data:m},{data:s}]=await Promise.all([sb.from('campaign_members').select('campaigns(id,title)').eq('user_id',me.id),sb.from('submissions').select('*,campaigns(title,cpm,max_payout)').eq('user_id',me.id).order('created_at',{ascending:false})]);
const sum=st=>s.filter(x=>x.status===st).reduce((a,x)=>a+Number(x.earnings),0);const pend=s.filter(x=>x.status==='pending').reduce((a,x)=>a+earn(x.claimed_views||0,x.campaigns),0);const views=s.filter(x=>x.status==='approved'||x.status==='paid').reduce((a,x)=>a+(x.verified_views||0),0);
app.innerHTML=`<h2>Your dashboard</h2><div class="stats"><div><b>${views.toLocaleString()}</b><span>Verified views</span></div><div><b>${s.length}</b><span>Submitted clips</span></div><div><b>${(m||[]).length}</b><span>Joined campaigns</span></div></div><br><div class="stats"><div><b style="color:var(--y)">${money(pend)}</b><span>Pending (estimated from claimed views)</span></div><div><b>${money(sum('approved'))}</b><span>Approved</span></div><div><b>${money(sum('paid'))}</b><span>Paid</span></div></div>
<h2>Joined campaigns</h2><div class="box">${(m||[]).map(x=>`<a class="gr" href="#/c/${x.campaigns.id}">${esc(x.campaigns.title)}</a>`).join('<br>')||'<span class="mut">None yet. <a class="gr" href="#/campaigns">Browse campaigns</a></span>'}</div>
<h2>Submission history</h2><div class="box sc"><table><tr><th>Date</th><th>Campaign</th><th>Platform</th><th>Views</th><th>Status</th><th>Earned</th></tr>${s.map(x=>`<tr><td>${new Date(x.created_at).toLocaleDateString()}</td><td>${esc(x.campaigns.title)}</td><td>${esc(x.platform)}</td><td>${(x.verified_views??x.claimed_views??0).toLocaleString()}</td><td>${x.status}</td><td>${money(x.earnings)}</td></tr>`).join('')||'<tr><td colspan=6 class="mut">No submissions yet.</td></tr>'}</table></div>`}
async function submit(){if(need())return;const{data:m}=await sb.from('campaign_members').select('campaigns(id,title,platforms,status)').eq('user_id',me.id);const cs=(m||[]).map(x=>x.campaigns).filter(c=>c.status==='active');
if(!cs.length){app.innerHTML='<h2>Submit a clip</h2><p class="mut">Join an active campaign first. <a class="gr" href="#/campaigns">Browse campaigns</a></p>';return}
app.innerHTML=`<h2>Submit a clip</h2><div class="box" style="max-width:520px"><label>Campaign</label><select id="sc">${cs.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select><label>Platform</label><select id="sp">${[...new Set(cs.flatMap(c=>c.platforms||[]))].map(p=>`<option>${esc(p)}</option>`).join('')}</select><label>Video / post URL</label><input id="su" type="url"><label>Your username on that platform</label><input id="sn"><label>Current view count</label><input id="sv" type="number" min="0"><label>Screenshot proof of views</label><input id="sf" type="file" accept="image/*"><button class="btn g" id="go">Submit for review</button></div>`;
$('#go').onclick=async()=>{const f=$('#sf').files[0];if(!f||!$('#su').value||!$('#sn').value||$('#sv').value==='')return say('Fill in every field and add a screenshot.');$('#go').disabled=true;
const path=me.id+'/'+Date.now()+'-'+f.name.replace(/[^\w.]/g,'_');const up=await sb.storage.from('proofs').upload(path,f);if(up.error){$('#go').disabled=false;return say(up.error.message)}
const{error}=await sb.from('submissions').insert({user_id:me.id,campaign_id:$('#sc').value,platform:$('#sp').value,url:$('#su').value,username:$('#sn').value,claimed_views:+$('#sv').value,proof_path:path});if(error){$('#go').disabled=false;return say(error.message)}say('Submitted! An admin will review it.');location.hash='#/dash'}}
window.proof=async p=>{const{data,error}=await sb.storage.from('proofs').createSignedUrl(p,120);error?say(error.message):window.open(data.signedUrl,'_blank')};
window.review=async(id,ok)=>{const{data:s}=await sb.from('submissions').select('*,campaigns(cpm,max_payout)').eq('id',id).single();const v=+document.getElementById('v'+id).value;if(ok&&!(v>=0))return say('Enter verified views.');
const{error}=await sb.from('submissions').update(ok?{status:'approved',verified_views:v,earnings:earn(v,s.campaigns),reviewed_at:new Date().toISOString()}:{status:'rejected',reviewed_at:new Date().toISOString()}).eq('id',id);error?say(error.message):(say(ok?'Approved':'Rejected'),admin())};
window.paid=async id=>{const{error}=await sb.from('submissions').update({status:'paid'}).eq('id',id);error?say(error.message):(say('Marked paid'),admin())};
window.cstat=async(id,st)=>{const{error}=await sb.from('campaigns').update({status:st}).eq('id',id);error?say(error.message):admin()};
window.cedit=async id=>{const{data:c}=await sb.from('campaigns').select('*').eq('id',id).single();const x=prompt('X account to tag',c.x_account);if(x===null)return;const t=prompt('TikTok account',c.tiktok_account);if(t===null)return;const d=prompt('Google Drive footage link',c.drive_link);if(d===null)return;const{error}=await sb.from('campaigns').update({x_account:x,tiktok_account:t,drive_link:d}).eq('id',id);error?say(error.message):(say('Saved'),admin())};
async function admin(){if(need())return;if(!prof||prof.role!=='admin'){app.innerHTML='<p class="err">Admins only.</p>';return}
const[{data:cs},{data:ss},{data:us}]=await Promise.all([sb.from('campaigns').select('*').order('created_at'),sb.from('submissions').select('*,campaigns(title,cpm,max_payout),profiles(email)').order('created_at',{ascending:false}),sb.from('profiles').select('*').order('created_at')]);
const spent=id=>ss.filter(x=>x.campaign_id===id&&(x.status==='approved'||x.status==='paid')).reduce((a,x)=>a+Number(x.earnings),0);
app.innerHTML=`<h2>Admin</h2><h2>Campaigns</h2><div class="box sc"><table><tr><th>Campaign</th><th>CPM / Max</th><th>Spent</th><th>Status</th><th></th></tr>${cs.map(c=>`<tr><td>${esc(c.title)}</td><td>${money(c.cpm)} / ${money(c.max_payout)}</td><td>${money(spent(c.id))} of ${money(c.budget)}</td><td>${c.status}</td><td>${c.status!=='active'?`<button onclick="cstat('${c.id}','active')">Activate</button> `:`<button onclick="cstat('${c.id}','paused')">Pause</button> `}${c.status!=='closed'?`<button onclick="cstat('${c.id}','closed')">Close</button> `:''}<button onclick="cedit('${c.id}')">Edit links</button></td></tr>`).join('')}</table></div>
<h2>New campaign</h2><div class="box"><label>Title</label><input id="nt"><label>Description</label><textarea id="nd" rows="3"></textarea><label>CPM ($ per 1k views)</label><input id="nc" type="number" step="0.01"><label>Total budget ($)</label><input id="nb" type="number"><label>Max payout per post ($)</label><input id="nm" type="number"><label>Platforms (comma separated)</label><input id="np" value="TikTok, X / Twitter, Instagram Reels"><button class="btn g" id="nn">Create campaign</button></div>
<h2>Submissions to review</h2><div class="box sc"><table><tr><th>Clipper</th><th>Clip</th><th>Claimed</th><th>Verify</th></tr>${ss.filter(x=>x.status==='pending').map(x=>`<tr><td>${esc(x.profiles.email)}<br><span class="mut">${esc(x.username)}</span></td><td><a class="gr" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.platform)}</a><br><button onclick="proof('${esc(x.proof_path)}')">View proof</button></td><td>${(x.claimed_views||0).toLocaleString()}</td><td><input id="v${x.id}" type="number" min="0" placeholder="verified views" style="width:130px"><br><button class="g" onclick="review('${x.id}',true)">Approve</button> <button class="red" onclick="review('${x.id}',false)">Reject</button></td></tr>`).join('')||'<tr><td colspan=4 class="mut">Nothing pending.</td></tr>'}</table></div>
<h2>Approved, awaiting payment</h2><div class="box sc"><table>${ss.filter(x=>x.status==='approved').map(x=>`<tr><td>${esc(x.profiles.email)}</td><td>${(x.verified_views||0).toLocaleString()} views</td><td>${money(x.earnings)}</td><td><button onclick="paid('${x.id}')">Mark paid</button></td></tr>`).join('')||'<tr><td class="mut">None.</td></tr>'}</table></div>
<h2>Creators (${us.length})</h2><div class="box">${us.map(u=>esc(u.email)+' · '+u.role).join('<br>')}</div>`;
$('#nn').onclick=async()=>{const{error}=await sb.from('campaigns').insert({title:$('#nt').value,description:$('#nd').value,cpm:+$('#nc').value,budget:+$('#nb').value,max_payout:+$('#nm').value,platforms:$('#np').value.split(',').map(s=>s.trim()).filter(Boolean)});error?say(error.message):(say('Created'),admin())}}
const routes={home,campaigns,c:camp,auth,dash,submit,admin};
async function route(){const h=location.hash.slice(2).split('/');app.innerHTML='<p class="mut">Loading…</p>';scrollTo(0,0);try{await(routes[h[0]||'home']||home)(h[1])}catch(e){app.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function load(){const{data}=await sb.auth.getSession();me=data.session?data.session.user:null;prof=null;if(me){const r=await sb.from('profiles').select('*').eq('id',me.id).single();prof=r.data}nav()}
sb.auth.onAuthStateChange(async()=>{await load();route()});addEventListener('hashchange',route);load().then(route);const _auth=auth;routes.auth=function(){_auth();const x=document.createElement('button');x.className='btn';x.style.cssText='width:100%;margin-top:10px';x.textContent='Continue with X';x.onclick=async()=>{const{error}=await sb.auth.signInWithOAuth({provider:'x',options:{redirectTo:location.origin+location.pathname}});if(error)say(error.message)};$('#go').after(x)};
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumex – Clipping campaigns</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<style>
:root{--bg:#0B0D0E;--card:#141718;--line:#23282B;--tx:#EDF1F2;--mut:#8C979B;--g:#22E58B;--r:#FF5C5C;--y:#FFC857;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
.w{max-width:1000px;margin:auto;padding:0 18px}
header{position:sticky;top:0;background:#0B0D0Eee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
header .w{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px}
.logo i{color:var(--g);font-style:normal}
#links{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.b,.btn,button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px}
.btn{display:inline-block;padding:12px 20px;font-weight:700}
.g{background:var(--g);color:#04130B;border-color:var(--g)}
.red{color:var(--r)}
.hero{padding:56px 0 24px;animation:in .6s}
.hero h1{font-size:clamp(38px,8vw,68px);line-height:1.02;margin:0 0 14px}
.hero em{color:var(--g);font-style:normal}
.row{display:flex;gap:10px;flex-wrap:wrap}
.mut{color:var(--mut)}
h2{margin:34px 0 14px}
.stats,.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.stats div,.card,.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;animation:in .5s}
.stats b{display:block;font-size:26px;color:var(--g)}
.stats span{color:var(--mut);font-size:13px}
.card h3{margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center}
.th{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--g),#0a7a4a);display:grid;place-items:center;font-weight:800;color:#04130B}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--g);color:var(--g);text-transform:uppercase}
.badge.paused{border-color:var(--y);color:var(--y)}
.badge.closed{border-color:var(--r);color:var(--r)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-bottom:14px}
.kv span{color:var(--mut)}
.gr{color:var(--g)}
input,select,textarea{width:100%;font:inherit;background:#0E1112;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 12px}
label{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sc{overflow-x:auto}
.err{color:var(--r)}
ul{padding-left:20px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--g);color:#04130B;padding:10px 16px;border-radius:12px;display:none;font-weight:600;max-width:90vw;z-index:9}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media(max-width:640px){.stats,.grid3{grid-template-columns:1fr}}
</style>

<!-- CINEMATIC LUMEX ANIMATION -->
<style id="lumex-cinematic-motion">
:root{--lx-neon:#22e58b;--lx-blue:#54c8ff}

#lx-intro{
position:fixed;
inset:0;
z-index:99999;
display:grid;
place-items:center;
overflow:hidden;
background:#05090a;
color:#f4fff9;
isolation:isolate;
transition:opacity .8s ease,visibility .8s ease
}

#lx-intro.lx-out{
opacity:0;
visibility:hidden;
pointer-events:none
}

#lx-canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
opacity:.8;
z-index:0
}

.lx-grid{
position:absolute;
inset:-50%;
background-image:
linear-gradient(rgba(34,229,139,.10) 1px,transparent 1px),
linear-gradient(90deg,rgba(34,229,139,.10) 1px,transparent 1px);
background-size:58px 58px;
transform:perspective(550px) rotateX(62deg) translateY(18%);
mask-image:linear-gradient(transparent 5%,#000 45%,transparent 90%);
animation:lx-gridmove 18s linear infinite;
z-index:0
}

.lx-aura{
position:absolute;
width:min(78vw,720px);
aspect-ratio:1;
border-radius:50%;
background:radial-gradient(circle,rgba(34,229,139,.17),rgba(34,229,139,.035) 38%,transparent 70%);
filter:blur(12px);
animation:lx-breathe 4s ease-in-out infinite;
z-index:1
}

.lx-content{
position:relative;
z-index:2;
width:min(92vw,720px);
text-align:center;
padding:30px 18px;
animation:lx-rise 1.1s cubic-bezier(.16,1,.3,1) both
}

.lx-mark{
width:112px;
height:112px;
margin:0 auto 35px;
position:relative;
display:grid;
place-items:center;
perspective:600px
}

.lx-orbit{
position:absolute;
inset:-18px;
border:1px solid rgba(34,229,139,.55);
border-radius:50%;
transform:rotateX(68deg) rotateZ(-25deg);
box-shadow:0 0 25px rgba(34,229,139,.13);
animation:lx-orbit 7s linear infinite
}

.lx-orbit:after{
content:"";
position:absolute;
width:8px;
height:8px;
left:12%;
top:17%;
border-radius:50%;
background:#b5ffdc;
box-shadow:0 0 16px 5px #22e58b
}

.lx-orbit.lx-two{
inset:-31px;
border-color:rgba(84,200,255,.28);
transform:rotateX(68deg) rotateZ(35deg);
animation-direction:reverse;
animation-duration:11s
}

.lx-cube{
width:66px;
height:66px;
position:relative;
transform-style:preserve-3d;
animation:lx-cuberotate 8s linear infinite
}

.lx-face{
position:absolute;
inset:0;
border:1px solid rgba(160,255,210,.95);
background:linear-gradient(145deg,rgba(34,229,139,.28),rgba(34,229,139,.025));
box-shadow:inset 0 0 20px rgba(34,229,139,.15),0 0 20px rgba(34,229,139,.12);
backdrop-filter:blur(5px)
}

.lx-face:nth-child(1){transform:translateZ(33px)}
.lx-face:nth-child(2){transform:rotateY(180deg) translateZ(33px)}
.lx-face:nth-child(3){transform:rotateY(90deg) translateZ(33px)}
.lx-face:nth-child(4){transform:rotateY(-90deg) translateZ(33px)}
.lx-face:nth-child(5){transform:rotateX(90deg) translateZ(33px)}
.lx-face:nth-child(6){transform:rotateX(-90deg) translateZ(33px)}

.lx-eyebrow{
font-size:11px;
letter-spacing:.42em;
text-transform:uppercase;
color:#8ca99b;
margin:0 0 14px;
animation:lx-fade .9s .2s both
}

.lx-title{
font-size:clamp(34px,8vw,68px);
font-weight:900;
line-height:1.02;
letter-spacing:-.055em;
margin:0;
text-shadow:0 0 35px rgba(34,229,139,.12);
animation:lx-titlein 1s .25s both
}

.lx-title span{
color:var(--lx-neon);
text-shadow:0 0 30px rgba(34,229,139,.35)
}

.lx-tagline{
margin:18px 0 30px;
color:#a6b8af;
font-size:clamp(12px,2vw,15px);
letter-spacing:.16em;
text-transform:uppercase;
animation:lx-fade 1s .55s both
}

.lx-loader{
width:min(230px,62vw);
height:3px;
background:#18231e;
border-radius:8px;
margin:0 auto;
overflow:hidden;
animation:lx-fade .8s .7s both
}

.lx-loader i{
display:block;
height:100%;
width:35%;
background:linear-gradient(90deg,transparent,#22e58b,#baffd9);
box-shadow:0 0 14px #22e58b;
animation:lx-load 2.4s .7s ease-in-out forwards
}

.lx-skip{
position:absolute;
z-index:4;
right:22px;
bottom:22px;
border:1px solid rgba(180,255,220,.22);
border-radius:99px;
padding:9px 15px;
background:rgba(10,20,15,.55);
color:#cce8d8;
font:11px system-ui;
letter-spacing:.16em;
text-transform:uppercase;
cursor:pointer;
backdrop-filter:blur(12px);
transition:.25s
}

.lx-skip:hover{
border-color:#22e58b;
color:#fff;
box-shadow:0 0 22px rgba(34,229,139,.2)
}

/* GLASS UI ANIMATIONS */
header{
background:rgba(8,12,11,.84)!important;
backdrop-filter:blur(18px)!important;
-webkit-backdrop-filter:blur(18px)!important;
transition:box-shadow .3s ease,border-color .3s ease
}

header:after{
content:"";
position:absolute;
left:0;
right:0;
bottom:-1px;
height:1px;
background:linear-gradient(90deg,transparent,rgba(34,229,139,.4),transparent);
pointer-events:none
}

.card,.box,.stats>div{
position:relative;
overflow:hidden;
transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s
}

.card:before,.box:before,.stats>div:before{
content:"";
position:absolute;
inset:0 auto 0 -130%;
width:65%;
background:linear-gradient(110deg,transparent,rgba(255,255,255,.055),transparent);
transform:skewX(-12deg);
transition:left .75s;
pointer-events:none
}

.card:hover:before,.box:hover:before,.stats>div:hover:before{
left:150%
}

.card:hover,.box:hover,.stats>div:hover{
transform:translateY(-4px);
border-color:rgba(34,229,139,.38);
box-shadow:0 14px 38px rgba(0,0,0,.22),0 0 24px rgba(34,229,139,.055)
}

.btn,button{
transition:transform .2s ease,box-shadow .25s ease,filter .25s ease
}

.btn:hover,button:hover{
filter:brightness(1.08);
box-shadow:0 0 20px rgba(34,229,139,.12)
}

.btn:active,button:active{
transform:scale(.97)
}

input:focus,select:focus,textarea:focus{
outline:none;
border-color:rgba(34,229,139,.75);
box-shadow:0 0 0 3px rgba(34,229,139,.09)
}

#app{animation:lx-pagein .45s ease both}

@keyframes lx-gridmove{to{background-position:58px 58px}}
@keyframes lx-breathe{0%,100%{transform:scale(.92);opacity:.65}50%{transform:scale(1.08);opacity:1}}
@keyframes lx-orbit{to{transform:rotateX(68deg) rotateZ(335deg)}}
@keyframes lx-cuberotate{0%{transform:rotateX(-24deg) rotateY(0)}100%{transform:rotateX(336deg) rotateY(360deg)}}
@keyframes lx-rise{from{opacity:0;transform:translateY(28px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes lx-titlein{from{opacity:0;transform:translateY(18px);letter-spacing:.02em}to{opacity:1;transform:none;letter-spacing:-.055em}}
@keyframes lx-fade{from{opacity:0}to{opacity:1}}
@keyframes lx-load{0%{transform:translateX(-120%)}100%{transform:translateX(340%)}}
@keyframes lx-pagein{from{opacity:.55;transform:translateY(7px)}to{opacity:1;transform:none}}

@media(max-width:640px){
.lx-mark{transform:scale(.88);margin-bottom:26px}
.lx-skip{right:14px;bottom:14px}
.card:hover,.box:hover,.stats>div:hover{transform:none}
}

@media(prefers-reduced-motion:reduce){
#lx-intro *,.card,.box,.stats>div,#app{animation:none!important;transition:none!important}
.lx-loader i{width:100%}
}
</style>
</head>

<body>

<!-- CINEMATIC INTRO -->
<div id="lx-intro" aria-label="Welcome to Lumexol">
<canvas id="lx-canvas"></canvas>
<div class="lx-grid"></div>
<div class="lx-aura"></div>

<div class="lx-content">

<div class="lx-mark">
<div class="lx-orbit"></div>
<div class="lx-orbit lx-two"></div>

<div class="lx-cube">
<i class="lx-face"></i>
<i class="lx-face"></i>
<i class="lx-face"></i>
<i class="lx-face"></i>
<i class="lx-face"></i>
<i class="lx-face"></i>
</div>
</div>

<p class="lx-eyebrow">The creator campaign network</p>

<h1 class="lx-title">
WELCOME TO <span>LUMEXOL</span>
</h1>

<p class="lx-tagline">
Clip it. &nbsp; Post it. &nbsp; Get paid.
</p>

<div class="lx-loader"><i></i></div>

</div>

<button class="lx-skip" id="lx-skip" type="button">Skip intro ↗</button>
</div>

<header>
<div class="w">
<a class="logo" href="#/">Lumex<i>.</i></a>
<div id="links"></div>
</div>
</header>

<main class="w" id="app"></main>
<div id="toast"></div>

<script>
const U="https://fthdldveifntsxqfadgi.supabase.co",K="sb_publishable_mC_LV7HxprKRqV2DO7Uj8A_dnyHIAV6";
const sb=supabase.createClient(U,K),$=s=>document.querySelector(s),app=$('#app');

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const earn=(v,c)=>Math.min(v/1000*c.cpm,c.max_payout);

let me=null,prof=null;

const say=m=>{
const t=$('#toast');
t.textContent=m;
t.style.display='block';
clearTimeout(say.t);
say.t=setTimeout(()=>t.style.display='none',3500)
};

const need=()=>{
if(!me){location.hash='#/auth';return true}
};

function nav(){
$('#links').innerHTML='<a href="#/campaigns">Campaigns</a>'+(me?'<a href="#/dash">Dashboard</a><a href="#/submit">Submit clip</a>':'')+(prof&&prof.role==='admin'?'<a href="#/admin">Admin</a>':'')+(me?'<button id="out">Sign out</button>':'<a class="b" href="#/auth">Sign in</a>');
const o=$('#out');
if(o)o.onclick=()=>sb.auth.signOut()
}

const card=c=>`<div class="card"><div class="top"><div class="th">${esc(c.title[0])}</div><span class="badge ${c.status}">${c.status}</span></div><h3>${esc(c.title)}</h3><div class="kv"><span>CPM</span><b class="gr">${money(c.cpm)} / 1k views</b><span>Budget</span><b>${money(c.budget)}</b><span>Max per post</span><b>${money(c.max_payout)}</b><span>Platforms</span><b>${esc((c.platforms||[]).join(', '))}</b></div><a class="btn g" href="#/c/${c.id}">View Campaign</a></div>`;

async function home(){
let[{data:s},{data:cs}]=await Promise.all([
sb.rpc('stats'),
sb.from('campaigns').select('*').eq('status','active').order('created_at').limit(3)
]);
s=s||{};

app.innerHTML=`<section class="hero"><h1>Clip it. Post it. <em>Get paid.</em></h1><p class="mut">Lumex is a clipping marketplace. Join a campaign, post short clips, and earn per 1,000 verified views.</p><div class="row"><a class="btn g" href="#/campaigns">Browse Campaigns</a><a class="btn" href="#/auth">Join as a Clipper</a></div></section>
<div class="stats"><div><b>${money(s.budget)}</b><span>Total campaign budget</span></div><div><b>${Number(s.views||0).toLocaleString()}</b><span>Verified views</span></div><div><b>${money(s.paid)}</b><span>Paid to creators</span></div></div>
<h2>How it works</h2><div class="grid3"><div class="box"><b>1. Join</b><p class="mut">Pick a campaign and join it.</p></div><div class="box"><b>2. Post</b><p class="mut">Cut clips from the footage and post them publicly.</p></div><div class="box"><b>3. Get paid</b><p class="mut">Submit proof of views. Once approved, you earn per 1,000 verified views.</p></div></div>
<h2>Active campaigns</h2><div class="grid">${(cs||[]).map(card).join('')||'<p class="mut">No active campaigns yet.</p>'}</div>`
}

async function campaigns(){
const{data}=await sb.from('campaigns').select('*').order('created_at');
app.innerHTML='<h2>Campaign marketplace</h2><div class="grid">'+(data||[]).map(card).join('')+'</div>'
}

async function camp(id){
const{data:c}=await sb.from('campaigns').select('*').eq('id',id).single();
let joined=false;

if(me){
const{data:m}=await sb.from('campaign_members').select('user_id').eq('user_id',me.id).eq('campaign_id',id);
joined=!!(m&&m.length)
}

app.innerHTML=`<h2>${esc(c.title)} <span class="badge ${c.status}">${c.status}</span></h2><p class="mut">${esc(c.description)}</p>
<div class="stats"><div><b>${money(c.cpm)}</b><span>per 1,000 views</span></div><div><b>${money(c.budget)}</b><span>Budget</span></div><div><b>${money(c.max_payout)}</b><span>Max per post</span></div></div>
<h2>Requirements</h2><div class="box"><p>Duration: <b>${esc(c.duration)}</b> · Platforms: <b>${esc((c.platforms||[]).join(', '))}</b></p><ul>${(c.requirements||[]).map(r=>'<li>'+esc(r)+'</li>').join('')}</ul></div>
<h2>Payment examples</h2><div class="box">${[1e4,5e4,1e5,2e5].map(v=>`<p>${v.toLocaleString()} views = <b class="gr">${money(earn(v,c))}</b></p>`).join('')}<p class="mut">Paid on verified views only. Max ${money(c.max_payout)} per post.</p></div>
<h2>Links</h2><div class="box"><p>X account to tag: <b>${esc(c.x_account)}</b></p><p>TikTok account: <b>${esc(c.tiktok_account)}</b></p><p>Footage: <a class="gr" href="${esc(c.drive_link)}" target="_blank" rel="noopener">${esc(c.drive_link)}</a></p></div>
<p>${joined?'<a class="btn g" href="#/submit">Submit a clip</a>':c.status==='active'?'<button class="btn g" id="join">Join Campaign</button>':'<span class="mut">This campaign is not open for joining.</span>'}</p>`;

const j=$('#join');
if(j)j.onclick=async()=>{
if(need())return;
const{error}=await sb.from('campaign_members').insert({user_id:me.id,campaign_id:id});
if(error)return say(error.message);
say('Joined!');
camp(id)
}
}

function auth(){
app.innerHTML=`<h2>Sign in to Lumex</h2><div class="box" style="max-width:420px"><label>Email</label><input id="em" type="email" autocomplete="email"><label>Password (6+ characters)</label><input id="pw" type="password" autocomplete="current-password"><div class="row"><button class="btn g" id="si">Sign in</button><button class="btn" id="su">Create account</button></div><p class="mut">or</p><button class="btn" id="go" style="width:100%">Continue with Google</button></div>`;

$('#si').onclick=async()=>{
const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
error?say(error.message):location.hash='#/dash'
};

$('#su').onclick=async()=>{
const{data,error}=await sb.auth.signUp({email:$('#em').value,password:$('#pw').value});
if(error)return say(error.message);
data.session?location.hash='#/dash':say('Check your email to confirm your account.')
};

$('#go').onclick=async()=>{
const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
if(error)say(error.message)
}
}

async function dash(){
if(need())return;
const[{data:m},{data:s}]=await Promise.all([
sb.from('campaign_members').select('campaigns(id,title)').eq('user_id',me.id),
sb.from('submissions').select('*,campaigns(title,cpm,max_payout)').eq('user_id',me.id).order('created_at',{ascending:false})
]);

const sum=st=>s.filter(x=>x.status===st).reduce((a,x)=>a+Number(x.earnings),0);
const pend=s.filter(x=>x.status==='pending').reduce((a,x)=>a+earn(x.claimed_views||0,x.campaigns),0);
const views=s.filter(x=>x.status==='approved'||x.status==='paid').reduce((a,x)=>a+(x.verified_views||0),0);

app.innerHTML=`<h2>Your dashboard</h2><div class="stats"><div><b>${views.toLocaleString()}</b><span>Verified views</span></div><div><b>${s.length}</b><span>Submitted clips</span></div><div><b>${(m||[]).length}</b><span>Joined campaigns</span></div></div><br><div class="stats"><div><b style="color:var(--y)">${money(pend)}</b><span>Pending (estimated from claimed views)</span></div><div><b>${money(sum('approved'))}</b><span>Approved</span></div><div><b>${money(sum('paid'))}</b><span>Paid</span></div></div>
<h2>Joined campaigns</h2><div class="box">${(m||[]).map(x=>`<a class="gr" href="#/c/${x.campaigns.id}">${esc(x.campaigns.title)}</a>`).join('<br>')||'<span class="mut">None yet. <a class="gr" href="#/campaigns">Browse campaigns</a></span>'}</div>
<h2>Submission history</h2><div class="box sc"><table><tr><th>Date</th><th>Campaign</th><th>Platform</th><th>Views</th><th>Status</th><th>Earned</th></tr>${s.map(x=>`<tr><td>${new Date(x.created_at).toLocaleDateString()}</td><td>${esc(x.campaigns.title)}</td><td>${esc(x.platform)}</td><td>${(x.verified_views??x.claimed_views??0).toLocaleString()}</td><td>${x.status}</td><td>${money(x.earnings)}</td></tr>`).join('')||'<tr><td colspan=6 class="mut">No submissions yet.</td></tr>'}</table></div>`
}

async function submit(){
if(need())return;
const{data:m}=await sb.from('campaign_members').select('campaigns(id,title,platforms,status)').eq('user_id',me.id);
const cs=(m||[]).map(x=>x.campaigns).filter(c=>c.status==='active');

if(!cs.length){
app.innerHTML='<h2>Submit a clip</h2><p class="mut">Join an active campaign first. <a class="gr" href="#/campaigns">Browse campaigns</a></p>';
return
}

/* CINEMATIC INTRO */

(function(){
const intro=$('#lx-intro');
const skip=$('#lx-skip');
const canvas=$('#lx-canvas');

if(!intro)return;

let closed=false;

function closeIntro(){
if(closed)return;
closed=true;
intro.classList.add('lx-out');

setTimeout(()=>{
intro.remove();
},900);
}

skip.onclick=closeIntro;

const timer=setTimeout(closeIntro,4200);

skip.addEventListener('click',()=>clearTimeout(timer));

/* PARTICLE ANIMATION */

const ctx=canvas.getContext('2d');

let width=0,height=0,particles=[];

function resize(){
width=canvas.width=window.innerWidth;
height=canvas.height=window.innerHeight;

const count=Math.min(90,Math.floor(width*height/13000));

particles=Array.from({length:count},()=>({
x:Math.random()*width,
y:Math.random()*height,
r:Math.random()*1.8+.4,
vx:(Math.random()-.5)*.35,
vy:(Math.random()-.5)*.35,
a:Math.random()*.65+.15
}));
}

function draw(){
if(closed)return;

ctx.clearRect(0,0,width,height);

particles.forEach(p=>{
p.x+=p.vx;
p.y+=p.vy;

if(p.x<0)p.x=width;
if(p.x>width)p.x=0;
if(p.y<0)p.y=height;
if(p.y>height)p.y=0;

ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fillStyle=`rgba(34,229,139,${p.a})`;
ctx.fill();
});

requestAnimationFrame(draw);
}

resize();
draw();

window.addEventListener('resize',resize);
})();

/* START */

load();
</script>

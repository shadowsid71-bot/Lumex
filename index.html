<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumex – Clipping campaigns</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<style>
:root{
--bg:#080b0c;--card:#141718;--line:#23282B;
--tx:#EDF1F2;--mut:#8C979B;--g:#22E58B;
--r:#FF5C5C;--y:#FFC857;
--glass-line:rgba(255,255,255,.11);
--glow:0 0 32px rgba(34,229,139,.12);
color-scheme:dark
}
*{box-sizing:border-box}
body{
margin:0;
background:
radial-gradient(ellipse at 15% 0%,rgba(34,229,139,.10),transparent 34%),
radial-gradient(ellipse at 90% 20%,rgba(35,105,84,.13),transparent 30%),
#080b0c;
background-attachment:fixed;
color:var(--tx);
font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)
}
a{color:inherit;text-decoration:none}
.w{max-width:1000px;margin:auto;padding:0 18px}
header{
position:sticky;top:0;
background:rgba(8,11,12,.72);
backdrop-filter:blur(22px) saturate(160%);
-webkit-backdrop-filter:blur(22px) saturate(160%);
border-bottom:1px solid var(--glass-line);
z-index:5
}
header .w{
display:flex;align-items:center;justify-content:space-between;
gap:10px;padding:12px 18px;flex-wrap:wrap
}
.logo{font-weight:900;font-size:24px;letter-spacing:1px}
.logo i{color:var(--g);font-style:normal}
#links{
display:flex;gap:8px;align-items:center;
flex-wrap:wrap;font-size:14px;color:var(--mut)
}
#links a,#links button{padding:8px 11px;border-radius:10px}
#links a:hover{color:var(--g);background:rgba(34,229,139,.08)}
.b,.btn,button{
font:inherit;cursor:pointer;border:1px solid var(--line);
background:var(--card);color:var(--tx);
border-radius:10px;padding:8px 14px;
transition:transform .2s,filter .2s,box-shadow .2s
}
.btn{display:inline-block;padding:12px 20px;font-weight:700}
.g{background:var(--g);color:#04130B;border-color:var(--g)}
.red{color:var(--r)}
button:hover,.btn:hover{transform:translateY(-2px);filter:brightness(1.12);box-shadow:0 8px 24px rgba(34,229,139,.12)}
.hero{position:relative;isolation:isolate;padding:64px 0 24px;animation:in .6s}
.hero h1{font-size:clamp(38px,8vw,68px);line-height:1.02;margin:0 0 14px}
.hero em{color:var(--g);font-style:normal}
.hero:before{
content:"";position:absolute;z-index:-1;width:320px;height:320px;
right:4%;top:-50px;border:1px solid rgba(34,229,139,.13);
border-radius:50%;
box-shadow:0 0 0 28px rgba(34,229,139,.025),0 0 0 58px rgba(34,229,139,.018);
animation:orbit 22s linear infinite
}
.hero:after{
content:"";position:absolute;z-index:-1;width:12px;height:12px;
right:18%;top:60px;border-radius:50%;background:var(--g);
box-shadow:0 0 24px var(--g);animation:floaty 4s ease-in-out infinite
}
.row{display:flex;gap:10px;flex-wrap:wrap}
.mut{color:var(--mut)}
h2{margin:34px 0 14px}
.stats,.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.stats div,.card,.box{
background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
border:1px solid var(--glass-line);
border-radius:16px;padding:18px;
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
box-shadow:var(--glow);
transition:transform .25s,border-color .25s,box-shadow .25s;
animation:in .5s
}
.card:hover,.box:hover{
transform:translateY(-3px);
border-color:rgba(34,229,139,.35);
box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 30px rgba(34,229,139,.09)
}
.stats b{display:block;font-size:26px;color:var(--g)}
.stats span{color:var(--mut);font-size:13px}
.card h3{margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center}
.th{
width:44px;height:44px;border-radius:12px;
background:linear-gradient(135deg,var(--g),#0a7a4a);
display:grid;place-items:center;font-weight:800;color:#04130B
}
.badge{
font-size:12px;padding:3px 10px;border-radius:99px;
border:1px solid var(--g);color:var(--g);text-transform:uppercase
}
.badge.paused{border-color:var(--y);color:var(--y)}
.badge.closed{border-color:var(--r);color:var(--r)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-bottom:14px}
.kv span{color:var(--mut)}
.gr{color:var(--g)}
input,select,textarea{
width:100%;font:inherit;background:rgba(5,9,10,.68);
color:var(--tx);border:1px solid rgba(255,255,255,.12);
border-radius:10px;padding:10px;margin:4px 0 12px
}
label{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sc{overflow-x:auto}
.err{color:var(--r)}
ul{padding-left:20px}
#toast{
position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
transform:translateX(-50%);background:var(--g);color:#04130B;
padding:10px 16px;border-radius:12px;display:none;
font-weight:600;max-width:90vw;z-index:1001
}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes floaty{50%{transform:translateY(24px);opacity:.55}}
#lumexIntro{
position:fixed;inset:0;z-index:1000;
background:radial-gradient(circle at 50% 45%,#10251d,#070a0b 65%);
display:grid;place-items:center;overflow:hidden;
transition:opacity .8s,visibility .8s
}
#lumexIntro.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro-grid{
position:absolute;inset:-50%;
background-image:
linear-gradient(rgba(34,229,139,.08) 1px,transparent 1px),
linear-gradient(90deg,rgba(34,229,139,.08) 1px,transparent 1px);
background-size:48px 48px;
transform:perspective(500px) rotateX(62deg) translateY(20%);
mask-image:linear-gradient(transparent,#000 35%,#000 70%,transparent);
animation:gridmove 14s linear infinite
}
@keyframes gridmove{to{background-position:0 48px,48px 0}}
.intro-orbit{
position:absolute;width:min(68vw,420px);aspect-ratio:1;
border:1px solid rgba(34,229,139,.35);border-radius:50%;
box-shadow:0 0 50px rgba(34,229,139,.08),inset 0 0 50px rgba(34,229,139,.06);
animation:orbit 12s linear infinite
}
.intro-orbit:before,.intro-orbit:after{
content:"";position:absolute;width:10px;height:10px;border-radius:50%;
background:#22e58b;box-shadow:0 0 22px #22e58b;top:12%;left:18%
}
.intro-orbit:after{top:auto;left:auto;bottom:12%;right:18%;width:6px;height:6px}
.intro-content{position:relative;text-align:center;padding:25px}
.intro-cube{
width:64px;height:64px;margin:0 auto 24px;
border:1px solid rgba(34,229,139,.8);transform:rotate(45deg);
box-shadow:0 0 35px rgba(34,229,139,.3),inset 0 0 25px rgba(34,229,139,.12);
animation:cubefloat 3s ease-in-out infinite
}
@keyframes cubefloat{50%{transform:rotate(225deg) translateY(-12px)}}
.intro-title{
font-size:clamp(42px,9vw,76px);font-weight:900;
letter-spacing:.18em;color:#effff7;
text-shadow:0 0 28px rgba(34,229,139,.35)
}
.intro-title span{color:#22e58b}
.intro-sub{color:#8fa69b;letter-spacing:.28em;font-size:11px;text-transform:uppercase;margin-top:8px}
.intro-loader{width:160px;height:3px;background:#1a3027;margin:28px auto 0;overflow:hidden;border-radius:9px}
.intro-loader i{display:block;height:100%;width:40%;background:#22e58b;box-shadow:0 0 14px #22e58b;animation:loadbar 1.3s ease-in-out infinite}
@keyframes loadbar{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
.profile-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid rgba(34,229,139,.7);background:#18221e}
.pill{display:inline-block;padding:4px 10px;border:1px solid var(--glass-line);border-radius:30px;color:var(--mut);font-size:12px}
.notice{border-left:3px solid var(--g);padding:12px 14px;margin:8px 0;background:rgba(34,229,139,.06);border-radius:8px}
@media(max-width:640px){
.stats,.grid3{grid-template-columns:1fr}
header .w{align-items:flex-start}
#links{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}
#links a,#links button{white-space:nowrap;font-size:12px}
.hero:before{width:220px;height:220px;right:-70px}
.intro-orbit{width:78vw}
}
@media(prefers-reduced-motion:reduce){
*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>

<body>
<header>
<div class="w">
<a class="logo" href="#/">Lumex<i>.</i></a>
<div id="links"></div>
</div>
</header>
<main class="w" id="app"></main>
<div id="toast"></div>

<script>
const U="https://fthdldveifntsxqfadgi.supabase.co";
const K="sb_publishable_mC_LV7HxprKRqV2DO7Uj8A_dnyHIAV6";
const sb=supabase.createClient(U,K);
const $=s=>document.querySelector(s);
const app=$('#app');

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const money=n=>'$'+Number(n||0).toLocaleString(undefined,{
minimumFractionDigits:2,maximumFractionDigits:2
});
const earn=(v,c)=>Math.min(v/1000*c.cpm,c.max_payout);

let me=null,prof=null;

const say=m=>{
const t=$('#toast');
t.textContent=m;t.style.display='block';
clearTimeout(say.t);
say.t=setTimeout(()=>t.style.display='none',3500)
};

const need=()=>{
if(!me){location.hash='#/auth';return true}
};

function nav(){
$('#links').innerHTML=
'<a href="#/campaigns">Campaigns</a>'+
(me?'<a href="#/dash">Dashboard</a><a href="#/submit">Submit clip</a>':'')+
(me?'<a href="#/profile">Profile</a><a href="#/notifications">Alerts</a>':'')+
(prof&&prof.role==='admin'?'<a href="#/admin">Admin</a>':'')+
(me?'<button id="out">Sign out</button>':'<a class="b" href="#/auth">Sign in</a>');
const o=$('#out');
if(o)o.onclick=()=>sb.auth.signOut()
}

const card=c=>`
<div class="card">
<div class="top">
<div class="th">${esc((c.title||'L')[0])}</div>
<span class="badge ${c.status}">${esc(c.status)}</span>
</div>
<h3>${esc(c.title)}</h3>
<div class="kv">
<span>CPM</span><b class="gr">${money(c.cpm)} / 1k views</b>
<span>Budget</span><b>${money(c.budget)}</b>
<span>Max per post</span><b>${money(c.max_payout)}</b>
<span>Platforms</span><b>${esc((c.platforms||[]).join(', '))}</b>
</div>
<a class="btn g" href="#/c/${c.id}">View Campaign</a>
</div>`;

async function home(){
let[{data:s},{data:cs}]=await Promise.all([
sb.rpc('stats'),
sb.from('campaigns').select('*').eq('status','active').order('created_at').limit(3)
]);
s=s||{};
app.innerHTML=`
<section class="hero">
<h1>Clip it. Post it. <em>Get paid.</em></h1>
<p class="mut">Lumex is a clipping marketplace. Join a campaign, post short clips, and earn per 1,000 verified views.</p>
<div class="row">
<a class="btn g" href="#/campaigns">Browse Campaigns</a>
<a class="btn" href="#/auth">Join as a Clipper</a>
</div>
</section>
<div class="stats">
<div><b>${money(s.budget)}</b><span>Total campaign budget</span></div>
<div><b>${Number(s.views||0).toLocaleString()}</b><span>Verified views</span></div>
<div><b>${money(s.paid)}</b><span>Paid to creators</span></div>
</div>
<h2>How it works</h2>
<div class="grid3">
<div class="box"><b>1. Join</b><p class="mut">Pick a campaign and join it.</p></div>
<div class="box"><b>2. Post</b><p class="mut">Cut clips from the footage and post them publicly.</p></div>
<div class="box"><b>3. Get paid</b><p class="mut">Submit proof of views. Once approved, you earn per 1,000 verified views.</p></div>
</div>
<h2>Active campaigns</h2>
<div class="grid">${(cs||[]).map(card).join('')||'<p class="mut">No active campaigns yet.</p>'}</div>`
}

async function campaigns(){
const{data}=await sb.from('campaigns').select('*').order('created_at');
app.innerHTML='<h2>Campaign marketplace</h2><div class="grid">'+(data||[]).map(card).join('')+'</div>'
}

async function getLeaderboard(id){
const{data,error}=await sb.rpc('get_campaign_leaderboard',{p_campaign_id:id});
if(error)return '<div class="box"><p class="mut">Leaderboard is temporarily unavailable.</p></div>';
return `
<h2>Top creators</h2>
<div class="box sc">
<table>
<tr><th>#</th><th>Creator</th><th>Platform</th><th>Verified views</th><th>Clips</th></tr>
${(data||[]).map((x,i)=>`
<tr>
<td>${i+1}</td>
<td>${esc(x.full_name||x.username||'Creator')}</td>
<td>${esc(x.platform||'—')}</td>
<td>${Number(x.verified_views||0).toLocaleString()}</td>
<td>${Number(x.approved_clips||0)}</td>
</tr>`).join('')||'<tr><td colspan="5" class="mut">No leaderboard entries yet.</td></tr>'}
</table>
</div>`
}

async function camp(id){
const{data:c,error}=await sb.from('campaigns').select('*').eq('id',id).single();
if(error||!c){app.innerHTML='<p class="err">Campaign not found.</p>';return}
let joined=false;
if(me){
const{data:m}=await sb.from('campaign_members').select('user_id').eq('user_id',me.id).eq('campaign_id',id);
joined=!!(m&&m.length)
}
const{data:rows}=await sb.from('submissions').select('earnings,status').eq('campaign_id',id);
const spent=(rows||[]).filter(x=>x.status==='approved'||x.status==='paid').reduce((a,x)=>a+Number(x.earnings||0),0);
const remaining=Math.max(0,Number(c.budget||0)-spent);
const pct=c.budget?Math.min(100,spent/Number(c.budget)*100):0;

app.innerHTML=`
<h2>${esc(c.title)} <span class="badge ${c.status}">${esc(c.status)}</span></h2>
<p class="mut">${esc(c.description)}</p>
<div class="stats">
<div><b>${money(c.cpm)}</b><span>per 1,000 views</span></div>
<div><b>${money(c.budget)}</b><span>Budget</span></div>
<div><b>${money(c.max_payout)}</b><span>Max per post</span></div>
</div>
<div class="box">
<h2>Campaign budget</h2>
<p>Spent <b>${money(spent)}</b> · Remaining <b class="gr">${money(remaining)}</b></p>
<div style="height:9px;background:#202a25;border-radius:20px;overflow:hidden">
<div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#22e58b,#8cffc4);border-radius:20px"></div>
</div>
<p class="mut">${pct.toFixed(1)}% of budget used</p>
${remaining<=0?'<b class="red">BUDGET COMPLETED</b>':''}
</div>
<h2>Requirements</h2>
<div class="box">
<p>Duration: <b>${esc(c.duration)}</b> · Platforms: <b>${esc((c.platforms||[]).join(', '))}</b></p>
<ul>${(c.requirements||[]).map(r=>'<li>'+esc(r)+'</li>').join('')}</ul>
</div>
<h2>Payment examples</h2>
<div class="box">
${[1e4,5e4,1e5,2e5].map(v=>`<p>${v.toLocaleString()} views = <b class="gr">${money(earn(v,c))}</b></p>`).join('')}
<p class="mut">Paid on verified views only. Max ${money(c.max_payout)} per post.</p>
</div>
<h2>Links</h2>
<div class="box">
<p>X account to tag: <b>${esc(c.x_account)}</b></p>
<p>TikTok account: <b>${esc(c.tiktok_account)}</b></p>
<p>Footage: <a class="gr" href="${esc(c.drive_link)}" target="_blank" rel="noopener">${esc(c.drive_link)}</a></p>
</div>
<p>
${joined?'<a class="btn g" href="#/submit">Submit a clip</a>':
c.status==='active'&&remaining>0?'<button class="btn g" id="join">Join Campaign</button>':
'<span class="mut">This campaign is not open for joining.</span>'}
</p>
${await getLeaderboard(id)}
`;
const j=$('#join');
if(j)j.onclick=async()=>{
if(need())return;
const{error}=await sb.from('campaign_members').insert({user_id:me.id,campaign_id:id});
if(error)return say(error.message);
say('Joined!');camp(id)
}
}

function auth(){
app.innerHTML=`
<h2>Sign in to Lumex</h2>
<div class="box" style="max-width:420px">
<label>Email</label><input id="em" type="email" autocomplete="email">
<label>Password (6+ characters)</label><input id="pw" type="password" autocomplete="current-password">
<div class="row">
<button class="btn g" id="si">Sign in</button>
<button class="btn" id="su">Create account</button>
</div>
<p class="mut">or</p>
<button class="btn" id="go" style="width:100%">Continue with Google</button>
<button class="btn" id="xlogin" style="width:100%;margin-top:10px">Continue with X</button>
</div>`;
$('#si').onclick=async()=>{
const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
error?say(error.message):location.hash='#/dash'
};
$('#su').onclick=async()=>{
const{data,error}=await sb.auth.signUp({email:$('#em').value,password:$('#pw').value});
if(error)return say(error.message);
data.session?location.hash='#/dash':say('Check your email to confirm your account.')
};
$('#go').onclick=async()=>{
const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
if(error)say(error.message)
};
$('#xlogin').onclick=async()=>{
const{error}=await sb.auth.signInWithOAuth({provider:'x',options:{redirectTo:location.origin+location.pathname}});
if(error)say(error.message)
}
}

async function dash(){
if(need())return;
const[{data:m},{data:s}]=await Promise.all([
sb.from('campaign_members').select('campaigns(id,title)').eq('user_id',me.id),
sb.from('submissions').select('*,campaigns(title,cpm,max_payout)').eq('user_id',me.id).order('created_at',{ascending:false})
]);
const sum=st=>s.filter(x=>x.status===st).reduce((a,x)=>a+Number(x.earnings),0);
const pend=s.filter(x=>x.status==='pending').reduce((a,x)=>a+earn(x.claimed_views||0,x.campaigns),0);
const views=s.filter(x=>x.status==='approved'||x.status==='paid').reduce((a,x)=>a+(x.verified_views||0),0);
app.innerHTML=`
<h2>Your dashboard</h2>
<div class="stats">
<div><b>${views.toLocaleString()}</b><span>Verified views</span></div>
<div><b>${s.length}</b><span>Submitted clips</span></div>
<div><b>${(m||[]).length}</b><span>Joined campaigns</span></div>
</div><br>
<div class="stats">
<div><b style="color:var(--y)">${money(pend)}</b><span>Pending estimate</span></div>
<div><b>${money(sum('approved'))}</b><span>Approved</span></div>
<div><b>${money(sum('paid'))}</b><span>Paid</span></div>
</div>
<h2>Joined campaigns</h2>
<div class="box">
${(m||[]).map(x=>`<a class="gr" href="#/c/${x.campaigns.id}">${esc(x.campaigns.title)}</a>`).join('<br>')||'<span class="mut">None yet. <a class="gr" href="#/campaigns">Browse campaigns</a></span>'}
</div>
<h2>Submission history</h2>
<div class="box sc">
<table>
<tr><th>Date</th><th>Campaign</th><th>Platform</th><th>Views</th><th>Status</th><th>Earned</th></tr>
${s.map(x=>`
<tr>
<td>${new Date(x.created_at).toLocaleDateString()}</td>
<td>${esc(x.campaigns.title)}</td>
<td>${esc(x.platform)}</td>
<td>${(x.verified_views??x.claimed_views??0).toLocaleString()}</td>
<td>${esc(x.status)}</td><td>${money(x.earnings)}</td>
</tr>`).join('')||'<tr><td colspan="6" class="mut">No submissions yet.</td></tr>'}
</table>
</div>`
}

async function submit(){
if(need())return;
const{data:m}=await sb.from('campaign_members').select('campaigns(id,title,platforms,status)').eq('user_id',me.id);
const cs=(m||[]).map(x=>x.campaigns).filter(c=>c.status==='active');
if(!cs.length){
app.innerHTML='<h2>Submit a clip</h2><p class="mut">Join an active campaign first. <a class="gr" href="#/campaigns">Browse campaigns</a></p>';
return
}
app.innerHTML=`
<h2>Submit a clip</h2>
<div class="box" style="max-width:520px">
<label>Campaign</label>
<select id="sc">${cs.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select>
<label>Platform</label>
<select id="sp">${[...new Set(cs.flatMap(c=>c.platforms||[]))].map(p=>`<option>${esc(p)}</option>`).join('')}</select>
<label>Video / post URL</label><input id="su" type="url">
<label>Your username on that platform</label><input id="sn">
<label>Current view count</label><input id="sv" type="number" min="0">
<label>Screenshot proof of views</label><input id="sf" type="file" accept="image/*">
<button class="btn g" id="go">Submit for review</button>
</div>`;
$('#go').onclick=async()=>{
const f=$('#sf').files[0];
if(!f||!$('#su').value||!$('#sn').value||$('#sv').value==='')return say('Fill in every field and add a screenshot.');
$('#go').disabled=true;
const path=me.id+'/'+Date.now()+'-'+f.name.replace(/[^\w.]/g,'_');
const up=await sb.storage.from('proofs').upload(path,f);
if(up.error){$('#go').disabled=false;return say(up.error.message)}
const{error}=await sb.from('submissions').insert({
user_id:me.id,campaign_id:$('#sc').value,platform:$('#sp').value,
url:$('#su').value,username:$('#sn').value,
claimed_views:+$('#sv').value,proof_path:path
});
if(error){$('#go').disabled=false;return say(error.message)}
say('Submitted! An admin will review  your clip.');
location.hash = '#/dash';
};
}

async function notifications(){

document.querySelectorAll('.statusBtn').forEach(b=>{
b.onclick=async()=>{
const{error}=await sb.from('campaigns')

/* SUBMISSION REVIEW */

document.querySelectorAll('.reviewBtn').forEach(b=>{
b.onclick=async()=>{
const s=ss.find(x=>x.id===b.dataset.id);
if(!s)return;

let update={reviewed_at:new Date().toISOString()};

if(b.dataset.action==='reject'){
update.status='rejected';
}

if(b.dataset.action==='approve'){
const answer=prompt('Enter verified views:',s.claimed_views||0);
if(answer===null)return;

const views=Number(answer);
if(!Number.isFinite(views)||views<0)return say('Invalid view count.');

const c=cs.find(x=>x.id===s.campaign_id);
if(!c)return say('Campaign not found.');

update.status='approved';
update.verified_views=views;
update.earnings=Number(Math.min(
views/1000*Number(c.cpm||0),
Number(c.max_payout||Infinity)
).toFixed(2));
}

if(b.dataset.action==='paid'){
update.status='paid';
}

const{error}=await sb.from('submissions')
.update(update).eq('id',s.id);

if(error)return say(error.message);
say('Submission updated!');
admin();
};
});

/* SOCIAL ACCOUNT REVIEW */

document.querySelectorAll('.socialBtn').forEach(b=>{
b.onclick=async()=>{
const{error}=await sb.from('social_accounts')
.update({
status:b.dataset.status,
reviewed_at:new Date().toISOString()
}).eq('id',b.dataset.id);

if(error)return say(error.message);
say('Account review updated!');
admin();
};
});
}

/* =====================================
   ROUTING
===================================== */

async function route(){
nav();

const path=location.hash||'#/';

try{
if(path==='#/'||path==='#')return home();
if(path==='#/campaigns')return campaigns();
if(path.startsWith('#/c/'))return camp(path.split('/')[2]);
if(path==='#/auth')return auth();
if(path==='#/dash')return dash();
if(path==='#/submit')return submit();
if(path==='#/profile')return profile();
if(path==='#/notifications')return notifications();
if(path==='#/wallet')return wallet();
if(path==='#/admin')return admin();

app.innerHTML='<h2>Page not found</h2><a class="btn g" href="#/">Go home</a>';

}catch(error){
console.error(error);
app.innerHTML='<div class="box"><p class="err">'+esc(error.message)+'</p></div>';
}
}

/* =====================================
   SESSION MANAGEMENT
===================================== */

async function load(){
const{data,error}=await sb.auth.getSession();

if(error)console.error(error);

me=data.session?.user||null;
prof=null;

if(me){
const{data:p}=await sb.from('profiles')
.select('*').eq('id',me.id).maybeSingle();

prof=p||null;
}

nav();
await route();
}

window.addEventListener('hashchange',route);

sb.auth.onAuthStateChange(()=>{
setTimeout(load,100);
});
